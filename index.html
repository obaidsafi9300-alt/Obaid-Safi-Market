<!-- OBAID SAFI MARKET - VERIFIED SIGN UP -->

<div id="verifySignupModal"
     style="
     display:none;
     position:fixed;
     inset:0;
     background:rgba(0,0,0,.82);
     z-index:99999;
     align-items:center;
     justify-content:center;
     padding:20px;
     overflow:auto;
     ">

  <div style="
       width:100%;
       max-width:500px;
       background:#0d233d;
       border:1px solid #31547c;
       border-radius:20px;
       padding:25px;
       color:white;
       ">

    <div style="
         display:flex;
         justify-content:space-between;
         align-items:center;
         margin-bottom:20px;
         ">

      <h2>Create Verified Account</h2>

      <span onclick="closeVerifySignup()"
            style="
            font-size:30px;
            cursor:pointer;
            ">
        ×
      </span>

    </div>


    <input id="verifyName"
           type="text"
           placeholder="Full Name"
           style="
           width:100%;
           padding:14px;
           margin-bottom:12px;
           background:#07172b;
           color:white;
           border:1px solid #31547c;
           border-radius:9px;
           ">


    <input id="verifyEmail"
           type="email"
           placeholder="Email"
           style="
           width:100%;
           padding:14px;
           margin-bottom:12px;
           background:#07172b;
           color:white;
           border:1px solid #31547c;
           border-radius:9px;
           ">


    <input id="verifyPassword"
           type="password"
           placeholder="Password"
           style="
           width:100%;
           padding:14px;
           margin-bottom:12px;
           background:#07172b;
           color:white;
           border:1px solid #31547c;
           border-radius:9px;
           ">


    <select id="verifyCountry"
            style="
            width:100%;
            padding:14px;
            margin-bottom:12px;
            background:#07172b;
            color:white;
            border:1px solid #31547c;
            border-radius:9px;
            ">

      <option value="">Select Country</option>
      <option value="Afghanistan">Afghanistan</option>
      <option value="Germany">Germany</option>
      <option value="France">France</option>
      <option value="United Kingdom">United Kingdom</option>
      <option value="Italy">Italy</option>
      <option value="Spain">Spain</option>
      <option value="Netherlands">Netherlands</option>
      <option value="Belgium">Belgium</option>
      <option value="Austria">Austria</option>
      <option value="Sweden">Sweden</option>
      <option value="Other">Other</option>

    </select>


    <select id="verifyIdType"
            style="
            width:100%;
            padding:14px;
            margin-bottom:15px;
            background:#07172b;
            color:white;
            border:1px solid #31547c;
            border-radius:9px;
            ">

      <option value="">Select ID Type</option>
      <option value="tazkira">Afghan Tazkira</option>
      <option value="national_id">National ID Card</option>
      <option value="passport">Passport</option>

    </select>


    <p style="margin-bottom:5px;">ID / Tazkira Front</p>

    <input id="verifyIdFront"
           type="file"
           accept="image/*"
           style="width:100%;margin-bottom:15px;">


    <p style="margin-bottom:5px;">ID Back</p>

    <input id="verifyIdBack"
           type="file"
           accept="image/*"
           style="width:100%;margin-bottom:15px;">


    <h3 style="margin:15px 0 10px;">
      Live Selfie Verification
    </h3>


    <video id="verifyVideo"
           autoplay
           playsinline
           style="
           width:100%;
           background:black;
           border-radius:12px;
           display:none;
           ">
    </video>


    <canvas id="verifyCanvas"
            style="display:none;">
    </canvas>


    <img id="verifySelfiePreview"
         alt=""
         style="
         width:100%;
         display:none;
         border-radius:12px;
         margin-bottom:10px;
         ">


    <button type="button"
            onclick="startVerifyCamera()"
            style="
            width:100%;
            padding:13px;
            margin-top:10px;
            background:#1678dc;
            border:0;
            border-radius:9px;
            color:white;
            cursor:pointer;
            ">
      Open Camera
    </button>


    <button type="button"
            onclick="captureVerifySelfie()"
            style="
            width:100%;
            padding:13px;
            margin-top:10px;
            background:#16a36a;
            border:0;
            border-radius:9px;
            color:white;
            cursor:pointer;
            ">
      Take Live Selfie
    </button>


    <p id="verifySelfieStatus"
       style="
       color:#36df8b;
       margin-top:10px;
       ">
    </p>


    <label style="
           display:block;
           margin:18px 0;
           line-height:1.5;
           ">

      <input id="verifyConsent"
             type="checkbox">

      I agree to identity verification.

    </label>


    <button type="button"
            onclick="submitVerifiedSignup()"
            style="
            width:100%;
            padding:15px;
            background:#ff3045;
            border:0;
            border-radius:9px;
            color:white;
            cursor:pointer;
            font-weight:bold;
            ">
      Create Account & Verify
    </button>


    <p id="verifyMessage"
       style="
       margin-top:15px;
       text-align:center;
       color:#9eb0c7;
       ">
    </p>

  </div>
</div>


<script>

let verifySelfieBlob = null;
let verifyCameraStream = null;


/* SIGN UP BUTTON WILL OPEN THIS NEW FORM */

function openSignup(){

  document.getElementById(
    "verifySignupModal"
  ).style.display = "flex";

}


function closeVerifySignup(){

  document.getElementById(
    "verifySignupModal"
  ).style.display = "none";

  stopVerifyCamera();

}


/* CAMERA */

async function startVerifyCamera(){

  const status =
    document.getElementById(
      "verifySelfieStatus"
    );

  try{

    verifyCameraStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:"user"
        },

        audio:false

      });

    const video =
      document.getElementById(
        "verifyVideo"
      );

    video.srcObject =
      verifyCameraStream;

    video.style.display =
      "block";

    status.textContent =
      "Camera opened ✓";

  }

  catch(error){

    status.textContent =
      "Camera permission was not allowed.";

  }

}


/* CAPTURE SELFIE */

function captureVerifySelfie(){

  const video =
    document.getElementById(
      "verifyVideo"
    );

  const canvas =
    document.getElementById(
      "verifyCanvas"
    );

  const preview =
    document.getElementById(
      "verifySelfiePreview"
    );

  const status =
    document.getElementById(
      "verifySelfieStatus"
    );


  if(
    !video.videoWidth ||
    !video.videoHeight
  ){

    status.textContent =
      "Open camera first.";

    return;

  }


  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;


  const ctx =
    canvas.getContext("2d");


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  canvas.toBlob(

    function(blob){

      verifySelfieBlob =
        blob;

      preview.src =
        URL.createObjectURL(blob);

      preview.style.display =
        "block";

      status.textContent =
        "Live selfie captured ✓";

      stopVerifyCamera();

    },

    "image/jpeg",

    0.9

  );

}


/* STOP CAMERA */

function stopVerifyCamera(){

  if(verifyCameraStream){

    verifyCameraStream
      .getTracks()
      .forEach(function(track){

        track.stop();

      });

    verifyCameraStream = null;

  }

}


/* SUBMIT */

async function submitVerifiedSignup(){

  const name =
    document
      .getElementById("verifyName")
      .value
      .trim();

  const email =
    document
      .getElementById("verifyEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("verifyPassword")
      .value;

  const country =
    document
      .getElementById("verifyCountry")
      .value;

  const idType =
    document
      .getElementById("verifyIdType")
      .value;

  const front =
    document
      .getElementById("verifyIdFront")
      .files[0];

  const back =
    document
      .getElementById("verifyIdBack")
      .files[0];

  const consent =
    document
      .getElementById("verifyConsent")
      .checked;

  const message =
    document
      .getElementById("verifyMessage");


  if(
    !name ||
    !email ||
    !password ||
    !country ||
    !idType
  ){

    message.textContent =
      "Complete all account information.";

    return;

  }


  if(!front){

    message.textContent =
      "Upload the front of your ID.";

    return;

  }


  if(
    idType !== "passport" &&
    !back
  ){

    message.textContent =
      "Upload the back of your ID.";

    return;

  }


  if(!verifySelfieBlob){

    message.textContent =
      "Take a live selfie.";

    return;

  }


  if(!consent){

    message.textContent =
      "Identity verification consent is required.";

    return;

  }


  const formData =
    new FormData();


  formData.append(
    "name",
    name
  );

  formData.append(
    "email",
    email
  );

  formData.append(
    "password",
    password
  );

  formData.append(
    "country",
    country
  );

  formData.append(
    "id_type",
    idType
  );

  formData.append(
    "id_front",
    front
  );


  if(back){

    formData.append(
      "id_back",
      back
    );

  }


  formData.append(
    "selfie",
    verifySelfieBlob,
    "selfie.jpg"
  );


  /*
    IMPORTANT:

    This address will later connect
    to YOUR OWN self-hosted server.

    The ID and selfie are NOT stored
    in localStorage.
  */


  message.textContent =
    "Verification files are ready ✓";


  /*
  Later we will activate this:

  const response = await fetch(
    "/api/register-verified",
    {
      method:"POST",
      body:formData
    }
  );

  */

}


/* CLOSE WHEN BACKGROUND IS CLICKED */

window.addEventListener(
  "click",
  function(event){

    const modal =
      document.getElementById(
        "verifySignupModal"
      );

    if(event.target === modal){

      closeVerifySignup();

    }

  }
);

</script>
