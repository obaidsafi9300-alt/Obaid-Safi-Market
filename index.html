<!-- ===== VERIFIED SIGN UP ===== -->

<div class="modal" id="signupModal">
  <div class="box">

    <div class="modal-head">
      <h2>Create Verified Account</h2>
      <span class="close" onclick="closeSignup()">×</span>
    </div>

    <input id="bioName"
           type="text"
           placeholder="Full Name">

    <input id="bioEmail"
           type="email"
           placeholder="Email">

    <input id="bioPassword"
           type="password"
           placeholder="Password">

    <select id="bioCountry">
      <option value="">Select Country</option>
      <option>Afghanistan</option>
      <option>Germany</option>
      <option>France</option>
      <option>United Kingdom</option>
      <option>Italy</option>
      <option>Spain</option>
      <option>Netherlands</option>
      <option>Belgium</option>
      <option>Austria</option>
      <option>Sweden</option>
      <option>Norway</option>
      <option>Denmark</option>
      <option>Switzerland</option>
      <option>United States</option>
      <option>Canada</option>
      <option>Australia</option>
      <option>Turkey</option>
      <option>UAE</option>
      <option>Saudi Arabia</option>
      <option>Pakistan</option>
      <option>India</option>
      <option>Other</option>
    </select>

    <select id="bioIdType">
      <option value="">Select Identity Document</option>
      <option value="tazkira">Afghan Tazkira</option>
      <option value="national-id">National ID Card</option>
      <option value="residence-card">Residence Card</option>
      <option value="passport">Passport</option>
    </select>

    <label>ID / Tazkira Front</label>
    <input id="bioIdFront"
           type="file"
           accept="image/jpeg,image/png,image/webp"
           capture="environment">

    <label>ID Back</label>
    <input id="bioIdBack"
           type="file"
           accept="image/jpeg,image/png,image/webp"
           capture="environment">

    <h3 style="margin-top:15px;">
      Face Biometric Verification
    </h3>

    <p style="color:#91a5bf;margin:8px 0;">
      Take a live selfie using the front camera.
    </p>

    <video id="bioVideo"
           autoplay
           playsinline
           muted
           style="
             display:none;
             width:100%;
             background:#000;
             border-radius:10px;
             margin:10px 0;
           ">
    </video>

    <canvas id="bioCanvas"
            style="display:none;">
    </canvas>

    <img id="bioPreview"
         alt=""
         style="
           display:none;
           width:100%;
           border-radius:10px;
           margin:10px 0;
         ">

    <button type="button"
            class="action blue"
            onclick="bioStartCamera()">
      Open Front Camera
    </button>

    <button type="button"
            class="action green"
            onclick="bioTakeSelfie()">
      Capture Live Selfie
    </button>

    <p id="bioStatus"
       style="color:#32db88;margin-top:10px;">
    </p>

    <label style="margin-top:15px;">
      <input id="bioConsent"
             type="checkbox"
             style="width:auto;margin-right:8px;">
      I agree to identity and biometric verification.
    </label>

    <button type="button"
            class="action"
            onclick="bioSubmitSignup()">
      Create Account & Verify
    </button>

    <p id="bioMessage"
       style="margin-top:12px;color:#a7b7cb;">
    </p>

  </div>
</div>


<script>

let bioSelfieBlob = null;
let bioCameraStream = null;


/* OPEN SIGN UP */

function openSignup(){

  document.getElementById(
    "signupModal"
  ).style.display = "flex";

}


/* CLOSE SIGN UP */

function closeSignup(){

  bioStopCamera();

  document.getElementById(
    "signupModal"
  ).style.display = "none";

}


/* OPEN FRONT CAMERA */

async function bioStartCamera(){

  const status =
    document.getElementById("bioStatus");

  try{

    bioCameraStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:"user",
          width:{ideal:1280},
          height:{ideal:720}
        },

        audio:false

      });

    const video =
      document.getElementById("bioVideo");

    video.srcObject =
      bioCameraStream;

    video.style.display =
      "block";

    status.textContent =
      "Front camera active ✓";

  }

  catch(error){

    status.textContent =
      "Camera permission is required.";

  }

}


/* CAPTURE LIVE SELFIE */

function bioTakeSelfie(){

  const video =
    document.getElementById("bioVideo");

  const canvas =
    document.getElementById("bioCanvas");

  const preview =
    document.getElementById("bioPreview");

  const status =
    document.getElementById("bioStatus");


  if(!video.videoWidth){

    status.textContent =
      "Open the camera first.";

    return;

  }


  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;


  const ctx =
    canvas.getContext("2d");


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  canvas.toBlob(

    function(blob){

      if(!blob){

        status.textContent =
          "Selfie capture failed.";

        return;

      }

      bioSelfieBlob =
        blob;

      preview.src =
        URL.createObjectURL(blob);

      preview.style.display =
        "block";

      status.textContent =
        "Live selfie captured ✓";

      bioStopCamera();

    },

    "image/jpeg",

    0.9

  );

}


/* STOP CAMERA */

function bioStopCamera(){

  if(bioCameraStream){

    bioCameraStream
      .getTracks()
      .forEach(function(track){

        track.stop();

      });

    bioCameraStream = null;

  }

}


/* CHECK SIGN UP + VERIFICATION */

function bioSubmitSignup(){

  const name =
    document.getElementById(
      "bioName"
    ).value.trim();

  const email =
    document.getElementById(
      "bioEmail"
    ).value.trim();

  const password =
    document.getElementById(
      "bioPassword"
    ).value;

  const country =
    document.getElementById(
      "bioCountry"
    ).value;

  const idType =
    document.getElementById(
      "bioIdType"
    ).value;

  const idFront =
    document.getElementById(
      "bioIdFront"
    ).files[0];

  const idBack =
    document.getElementById(
      "bioIdBack"
    ).files[0];

  const consent =
    document.getElementById(
      "bioConsent"
    ).checked;

  const message =
    document.getElementById(
      "bioMessage"
    );


  if(
    !name ||
    !email ||
    !password ||
    !country ||
    !idType
  ){

    message.textContent =
      "Complete all account information.";

    return;

  }


  if(!idFront){

    message.textContent =
      "Upload the front of your ID.";

    return;

  }


  if(
    idType !== "passport" &&
    !idBack
  ){

    message.textContent =
      "Upload the back of your ID.";

    return;

  }


  if(!bioSelfieBlob){

    message.textContent =
      "Take your live biometric selfie.";

    return;

  }


  if(!consent){

    message.textContent =
      "Verification consent is required.";

    return;

  }


  const verificationData =
    new FormData();


  verificationData.append(
    "name",
    name
  );

  verificationData.append(
    "email",
    email
  );

  verificationData.append(
    "password",
    password
  );

  verificationData.append(
    "country",
    country
  );

  verificationData.append(
    "id_type",
    idType
  );

  verificationData.append(
    "id_front",
    idFront
  );


  if(idBack){

    verificationData.append(
      "id_back",
      idBack
    );

  }


  verificationData.append(
    "selfie",
    bioSelfieBlob,
    "live-selfie.jpg"
  );


  /*
    READY FOR YOUR SELF-HOSTED BACKEND.

    Later we connect:

    fetch("/api/identity/register", {
      method:"POST",
      body:verificationData
    });

    Backend will perform:

    1. ID validation
    2. Face detection
    3. Selfie ↔ ID face comparison
    4. Liveness check
    5. Duplicate-account check
    6. Pending / Verified / Rejected status
  */


  message.textContent =
    "ID and biometric selfie ready for verification ✓";

}


/* CLOSE BY BACKGROUND */

window.addEventListener(
  "click",
  function(event){

    const modal =
      document.getElementById(
        "signupModal"
      );

    if(event.target === modal){

      closeSignup();

    }

  }
);

</script>
