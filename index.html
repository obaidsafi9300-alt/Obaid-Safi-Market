<div class="modal" id="signupModal">
  <div class="box">
    <span class="close" onclick="closeModal('signupModal')">×</span>

    <h2>Create Account</h2>

    <input id="signupName" placeholder="Full Name">

    <input id="signupEmail"
           type="email"
           placeholder="Email">

    <input id="signupPassword"
           type="password"
           placeholder="Password">

    <select id="signupCountry"
            style="width:100%;padding:13px;margin:7px 0;
            background:#07182c;color:white;
            border:1px solid #355577;border-radius:8px">
      <option value="">Select Country</option>
      <option>Afghanistan</option>
      <option>Germany</option>
      <option>France</option>
      <option>United Kingdom</option>
      <option>Italy</option>
      <option>Spain</option>
      <option>Netherlands</option>
      <option>Belgium</option>
      <option>Austria</option>
      <option>Sweden</option>
      <option>Other</option>
    </select>

    <select id="idType"
            style="width:100%;padding:13px;margin:7px 0;
            background:#07182c;color:white;
            border:1px solid #355577;border-radius:8px">
      <option value="">Select ID Type</option>
      <option value="tazkira">Afghan Tazkira</option>
      <option value="national_id">National ID Card</option>
      <option value="passport">Passport</option>
    </select>

    <p style="margin-top:12px">ID Front</p>
    <input id="idFront"
           type="file"
           accept="image/*">

    <p style="margin-top:12px">ID Back</p>
    <input id="idBack"
           type="file"
           accept="image/*">

    <p style="margin-top:12px">Live Selfie</p>

    <video id="selfieVideo"
           autoplay
           playsinline
           style="width:100%;border-radius:10px;
           background:black;margin-top:8px"></video>

    <canvas id="selfieCanvas"
            style="display:none"></canvas>

    <button type="button"
            onclick="startCamera()">
      Open Camera
    </button>

    <button type="button"
            onclick="captureSelfie()">
      Take Selfie
    </button>

    <p id="selfieStatus"
       style="color:#28db83;margin-top:8px"></p>

    <label style="display:block;margin-top:15px">
      <input id="verificationConsent"
             type="checkbox">
      I agree to identity verification
    </label>

    <button onclick="submitVerification()">
      Create Account & Verify ID
    </button>

  </div>
</div>
