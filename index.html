<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obaid Safi Market</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f3f3;
    }

    header {
      background: #131921;
      color: white;
      padding: 15px 25px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .search {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
    }

    nav {
      background: #232f3e;
      color: white;
      padding: 12px 25px;
    }

    nav span {
      margin-right: 25px;
    }

    .hero {
      text-align: center;
      padding: 80px 20px;
      background: white;
    }

    .hero h1 {
      font-size: 42px;
    }

    .hero p {
      font-size: 18px;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 30px;
      background: #ffd814;
      color: #111;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .categories {
      padding: 30px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">OBAID SAFI MARKET</div>
  <input class="search" type="text" placeholder="Search Obaid Safi Market">
  <div>Hello, Sign in<br><b>Account</b></div>
  <div><b>Cart</b></div>
</header>

<nav>
  <span>All</span>
  <span>Today's Deals</span>
  <span>Electronics</span>
  <span>Fashion</span>
  <span>Home</span>
  <span>Beauty</span>
  <span>New Arrivals</span>
</nav>

<section class="hero">
  <h1>Welcome to Obaid Safi Market</h1>
  <p>Discover products from sellers around the world. Shop easily, securely and conveniently.</p>
  <a class="button" href="#">Start Shopping</a>
</section>

<section class="categories">
  <h2>Shop by Category</h2>
  <h3>Electronics</h3>
  <h3>Fashion</h3>
  <h3>Home</h3>
  <h3>Beauty</h3>
</section>

</body>
</html>
